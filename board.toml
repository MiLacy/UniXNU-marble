schema_version = 2

[board]
name = "marble"
soc = "SM7475"
soc_source = "sm7475"
os_profile = "ipados-17.7.11-21H461"
description = "Redmi Note 12 Turbo / POCO F5 (marble), Qualcomm SM7475 (Snapdragon 7+ Gen 2)"
kit = "marble"

[components]
# First bring-up selection: platform expert, CPU/GIC, source crypto, UFS,
# prelink and the UEFI loader. GopFramebuffer is selected for the display
# path but stays disabled in marble_defconfig until the console boot is
# established on hardware.
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "ShengUfs",
  "GopFramebuffer",
  "XnuPrelink",
  "DarwinBoot",
  "QcomGeniSpi",
  "VirtioMmioBlock",
  "RamBlock",
]

[kernel]
defconfig = "marble_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm7475.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "component:ShengUfs",
  "build-storage-bindings.py",
  "component:VirtioMmioBlock",
  "storage-bindings.py --component NativeVirtioBlock --archive libVirtioMmioBlock.a --directory build/virtio-mmio-block --subset",
  "build-arm-driver.py NativeVirtioBlock --verified-root --verified-root-bundle",
  "storage-bindings.py --component NativeVirtioBlock --archive libVirtioMmioBlock.a --directory build/virtio-mmio-block-verified-bundle --subset",
  "component:RamBlock",
  "storage-bindings.py --component NativeRamBlock --archive libRamBlock.a --directory build/ram-block --subset",
  "build-software-aes-bindings.py",
  "build-marble-stubs.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-platform-power.py",
  "build-marble-unverified-root.py",
  "build-boot-progress.py",
  "build-gop-framebuffer.py",
]

[device_tree]
source = "device:dts/marble.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "marble"
dsc = "Platforms/Xiaomi/marblePkg/marble.dsc"
fd = "Build/marblePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# The vendor modules in the Mu-Silicium checkout are already initialized.
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = [
  "Resources/MuPatches/Auth-Service.patch",
  "Resources/MuPatches/Boot-Manager.patch",
  "Resources/MuPatches/Timer.patch",
  "Resources/MuPatches/Usb-Bus.patch",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/SoCs/Qualcomm",
]

[firmware.defines]
# 0 matches the stock Mu-Silicium build default. The XNU loader is embedded
# in the firmware volume, so image verification does not depend on the
# platform secure-boot switch.
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "marble"


[payload]
volume = "MARBLEESP"
size_mib = 160
loader = "firmware"
title = "UniXNU marble"
panic_screen = true
# Owner-verified root on the userdata tail, with the SystemOS cache/union and
# the ephemeral Data seed. See docs/REAL-DEVICE-TESTS.md.
kernel_args = ["-v", "serial=3", "debug=0x14e", "cpus=8", "native-ufs-stream=0xe0", "native-ufs-smmu-takeover=1", "native-ufs-root=1", "native-ufs-root-lba=59589627", "native-ufs-root-blocks=2290688", "sheng-pmgr=2", "sheng-disable-jobs=com.apple.fairplayd.A2,com.apple.bluetoothd,com.apple.passd", "-no_slto_panic"]

# kern.hv_vmm_present=1: watchdogd treats the machine as a VM and exits 0 when
# the Apple IOWatchdog service is absent (marble has no wdt,s5l8960x node);
# without it watchdogd traps with SIGTRAP and launchd's panic-on-exit panics
# the boot (the same finding as evb10). See docs/REAL-DEVICE-TESTS.md.
[adt.defaults.u32]
vmm-present = 1

# Development boot-set identity for the unverified tail root. launchd's
# mount -P 1 needs a 48-byte /chosen/boot-manifest-hash; without a verified-root
# bundle there is no owner manifest to publish. This is an opaque bring-up
# identity (SHA-384 of the domain string), not an Apple or owner signature.
[adt.chosen.bytes]
boot-manifest-hash = "ccdc24fc882151416af5794568f0f32f7b3878572e6c8b3520b0690763ef6bb63a34c055f783af09d38ecd1c679196c6"

[payload.adt]
chip_id = "207"
owned_memory_size = "0x100000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true
unique_chip_id = "required"
ipad_identity = true

# Android boot image v0: the fastboot boot path on marble does not reliably
# load the v4 ramdisk. The kernel lands at 0x80008000 and the 160 MiB payload
# at 0xA8000000-0xB2000000, above the PIL reservation at 0x85200000 and below
# the display reservation at 0xB8000000.
[bootimg.image]
base = 0x80000000
kernel_offset = 0x8000
ramdisk_offset = 0x28000000
tags_offset = 0x100
pagesize = 4096
header_version = 0

# The bootloader may not rewrite /chosen for a fastboot boot image. Keep the
# initrd range in the appended DTB equal to the v0 header's ramdisk address.
[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "linux,initrd-start", type = "x", value = "0xA8000000" },
  { name = "linux,initrd-end", type = "x", value = "0xB2000000" },
]

# Measured on the phone with the read-only UFS probe (2026-10-31):
# GPT entry "userdata" on LUN 0, 4096-byte LBAs, 224.2 GiB.
[userdata]
first_lba = 0x2f6a00
last_lba = 0x3b037fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]
